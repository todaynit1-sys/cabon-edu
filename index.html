<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cabon-edu.vercel.app/og.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin media="print" onload="this.media='all'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" media="print" onload="this.media='all'">

<link rel="stylesheet" href="css/fun.css">
</head>
<body>
<canvas id="c" aria-label="체험관 3D 화면. 친구를 누르면 걸어가서 이야기해요."></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="joyZone" aria-hidden="true"><div id="joy" class="idle"><div id="knob"></div></div></div>

<header id="hud" hidden>
  <div class="hud-left">
    <div class="fever card hot" aria-live="polite">
      <div class="fever-face" id="feverFace">🥵</div>
      <div class="fever-body">
        <div class="fever-title"><span id="meterName">지구 열</span> <b id="feverText">아주 뜨거워요</b><em class="fever-delta" id="feverDelta" hidden></em></div>
        <div class="fever-bar"><i id="feverBar" style="width:100%"></i></div>
        <small class="fever-sub" id="feverSub"></small>
      </div>
    </div>
    <button class="quest card" id="quest" aria-label="다음 할 일 (누르면 데려다줘요)">
      <span class="q-ico" id="questIco">🎯</span>
      <span class="q-txt"><small>다음 할 일</small><b id="questTxt">친구를 찾아가 봐요</b></span>
      <span class="q-go" id="questGo">데려다줘 ▶</span>
    </button>
  </div>
  <nav class="stamps card" id="stamps" aria-label="마을 도장과 모은 것 (도장을 누르면 데려다줘요)"></nav>
  <div class="tools">
    <button id="btnSound" class="tool icon" aria-label="소리 켜기/끄기">🔊</button>
    <button id="btnMenu" class="tool icon" aria-label="설정">⚙️</button>
  </div>
</header>
<div class="fabs" id="fabs" hidden>
  <button class="fab rest" id="fabMung"><span aria-hidden="true">🌿</span><small>멍 때리기</small></button>
  <button class="fab calc" id="fabCalc"><span aria-hidden="true">🧮</span><small>탄소 재기</small></button>
  <button class="fab ai" id="fabLearn"><span aria-hidden="true">📚</span><small>AI 배움터</small></button>
  <button class="fab bear" id="fabBear"><span aria-hidden="true">🐻‍❄️</span><small id="fabBearName">얼음이</small></button>
  <button class="fab wear" id="fabWear"><span aria-hidden="true">👕</span><small>꾸미기</small></button>
  <button class="fab photo" id="fabPhoto"><span aria-hidden="true">📸</span><small>사진</small></button>
  <button class="fab jump" id="fabJump"><span aria-hidden="true">⬆️</span><small>점프</small></button>
  <button class="fab more" id="fabMore" aria-expanded="false" aria-label="메뉴 열기"><span aria-hidden="true">☰</span><small>메뉴</small></button>
</div>
<div id="say" class="saybubble" role="status" hidden></div>
<div id="effect" class="effect" role="status" hidden></div>
<div id="hint" class="hint" hidden>👆 땅이나 친구를 누르면 걸어가요 · ⌨️ 방향키로 걷고 스페이스로 점프!</div>
<button id="btnTalk" class="talk-btn" hidden>💬 <span id="talkLabel">말 걸기</span></button>

<section id="start" class="screen">
  <div class="start-card">
    <div class="logo" aria-hidden="true"><span class="globe">🌏</span><span class="pack">🧊</span></div>
    <p class="brand-line">✨ AI 탄소중립 체험실</p>
    <h1 id="stTitle">체험관</h1>
    <p class="sub" id="stSub"></p>
    <p class="lead" id="stLead"></p>
    <div class="step"><h2>나는 지금</h2><div class="grades" id="grades"></div></div>
    <div class="step"><h2>내 캐릭터</h2><div class="presets" id="avatars"></div><button class="custom-btn" id="btnCustom" type="button">✏️ 직접 꾸미기 <small>나이 · 성별 · 피부 · 눈 · 입 · 머리 · 옷 · 소품</small></button></div>
    <button id="btnStart" class="big-btn">체험관으로 출발! 🚀</button>
    <p class="made" id="stMade"></p>
    <div class="start-links"><button class="linkbtn" id="btnPacks">다른 체험관 열기</button><a class="linkbtn" href="maker.html">담당자용: AI 체험관 메이커</a></div>
  </div>
</section>

<div id="modal" class="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true" aria-live="polite"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="nogl" class="nogl" hidden></div>
<div id="printArea" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/text.js"></script>
<script src="js/safety.js"></script>
<script src="js/llm.js"></script>
<script src="js/ai.js"></script>
<script src="js/pack.js"></script>
<script src="packs/green.js"></script>
<script src="js/world.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
window.dispatchEvent(new Event('three-ready'));
</script>
<script>
setTimeout(function () {
  if (!window.THREE) { var n = document.getElementById('nogl'); n.textContent = '3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; n.hidden = false; }
}, 15000);
</script>
</body>
</html>
